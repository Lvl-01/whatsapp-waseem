<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>واتس حرب</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="mobile-page">
  <main class="phone-shell">
    <div class="status-bar">
      <span>9:41</span>
      <div class="notch"></div>
      <div class="icons">
        <span>▮▮▮</span>
        <span>◔</span>
        <span>▭</span>
      </div>
    </div>

    <section class="mobile-header simple">
      <h1>واتس حرب</h1>
      <p>للتعلّم والتجريب فقط</p>
    </section>

    <section class="white-card">
      <h2>أدخل رقم الجوال</h2>
      <p class="sub">اختر رمز الدولة ثم أدخل رقم الجوال</p>

      {% if request.query_params.get("error") %}
      <div class="error-box">يرجى إدخال رقم جوال صحيح.</div>
      {% endif %}

      <form action="/start" method="post" class="stack">
        <div class="select-row">
          <span class="caret">⌄</span>
          <select name="country_code" class="select-input">
            <option value="966">المملكة العربية السعودية +966</option>
            <option value="971">الإمارات العربية المتحدة +971</option>
            <option value="965">دولة الكويت +965</option>
            <option value="973">مملكة البحرين +973</option>
            <option value="974">دولة قطر +974</option>
            <option value="968">سلطنة عمان +968</option>
            <option value="20">جمهورية مصر العربية +20</option>
          </select>
        </div>

        <div class="text-input with-icon">
          <span class="icon">☏</span>
          <input type="tel" name="phone" placeholder="5XXXXXXXX" required>
        </div>

        <button class="green-btn" type="submit">التالي</button>
      </form>
    </section>

    <div class="wave"></div>
    <div class="home-indicator"></div>
  </main>
</body>
</html>
