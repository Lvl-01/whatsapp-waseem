<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
<title>واتس حرب</title>
</head>
<body class="site-page">
  <main class="page-shell">
    <section class="brand-top">
      <h1>واتس حرب</h1>
      <p>للتعلّم والتجريب فقط</p>
    </section>

    <section class="panel user-panel">
      <div class="panel-header">
        <h2>أدخل رقم الجوال</h2>
        <p>اختر رمز الدولة ثم أدخل رقم الجوال</p>
      </div>

      {% if request.query_params.get("error") %}
      <div class="alert error">يرجى إدخال رقم جوال صحيح.</div>
      {% endif %}

      <form action="/start" method="post" class="form-stack">
        <div class="field">
          <label>رمز الدولة</label>
          <select name="country_code" class="input select" required>
            <option value="966">المملكة العربية السعودية +966</option>
            <option value="971">الإمارات العربية المتحدة +971</option>
            <option value="965">دولة الكويت +965</option>
            <option value="973">مملكة البحرين +973</option>
            <option value="974">دولة قطر +974</option>
            <option value="968">سلطنة عمان +968</option>
            <option value="20">جمهورية مصر العربية +20</option>
          </select>
        </div>

        <div class="field">
          <label>رقم الجوال</label>
          <input class="input" type="tel" name="phone" placeholder="5XXXXXXXX" required>
        </div>

        <button class="btn-primary" type="submit">التالي</button>
      </form>
    </section>
  </main>
</body>
</html>
